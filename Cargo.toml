[workspace]
resolver = "3"
members = [
    "aelys",
    "core",
    "common",
    "syntax",
    "frontend",
    "sema",
    "opt",
    "air",
    "codegen",
    "driver",
    "cli",
]

[workspace.package]
version = "0.21.5-a"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug = false
overflow-checks = false
debug-assertions = false
rpath = false
